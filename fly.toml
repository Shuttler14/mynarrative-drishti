# fly.toml — Drishti API on Fly.io

app = "drishti-api"
primary = "ams"

[build]
  dockerfile = "Dockerfile"

[env]
  ENV = "production"
  PORT = "8000"
  # Local u2net takes 60-90s per image on this shared vCPU — Replicate rembg
  # (~7s) is the primary path; keep the ONNX session out of memory entirely
  REMBG_LOCAL = "off"
  CORS_ORIGINS = '["https://mynarrative.in","https://www.mynarrative.in"]'
  SHOPIFY_STORE_URL = "https://mynarrative.in"
  SHOPIFY_DOMAIN = "jjdk0v-0c.myshopify.com"
  VTOE_GPU_URL = "https://vton.mynarrative.in"
  AWS_REGION = "eu-north-1"
  S3_BUCKET = "mynarrative-dtf-bucket"
  # All 4 slot queries fan out together (SerpApi handles the burst —
  # concurrent probe: ~350ms/query vs a serialized tail wave at 3)
  SERPAPI_CONCURRENCY = "4"

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  [http_service.concurrency]
    type = "requests"
    hard_limit = 100
    soft_limit = 80

[[http_service.checks]]
  grace_period = "30s"
  interval = "30s"
  method = "GET"
  path = "/health"

[[vm]]
  # 1024MB OOM-killed uvicorn repeatedly (extract + live traffic ≈ 870MB RSS);
  # 2048MB gives headroom. Scales applied outside this file get reset to this
  # value on every deploy — change it HERE.
  memory = "2048mb"
  cpu_kind = "shared"
  cpus = 1
